apiVersion: v1
kind: Service
metadata:
  name: devops-portfolio-app
  labels:
    app: devops-portfolio-app
spec:
  type: LoadBalancer # provisions an AWS NLB via the AWS cloud-controller on EKS
  selector:
    app: devops-portfolio-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
